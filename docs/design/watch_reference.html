<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinList · Watch — developer reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#20222a;color:#e8eaf0;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px;margin:0 auto;padding:32px 24px 80px;}
  h1{font-size:22px;font-weight:700;margin:0 0 4px;}
  .sub{font-size:13px;color:#9aa0ad;margin-bottom:26px;}
  .layout{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;}
  .col-desk{flex:1;min-width:440px;}
  .col-mob{flex:0 0 300px;}
  .cap{font-size:12px;font-weight:600;color:#9aa0ad;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
  .win{border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);}
  .winbar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:#2a2d36;}
  .winbar i{width:11px;height:11px;border-radius:50%;background:#4a4f5c;}
  .winbar .u{margin-left:10px;font-size:11px;color:#8890a0;font-family:'IBM Plex Mono',monospace;}
  .screen{position:relative;height:520px;}
  .screen.mob{height:600px;}

  /* ===== app ===== */
  .app{position:absolute;inset:0;font-family:var(--font-body);overflow:hidden;
    --tw-list-opacity:50;--tw-list-blur:12;}
  .map{position:absolute;inset:0;background:var(--land2);}
  .map .grid{position:absolute;inset:-10%;background-image:linear-gradient(0deg,var(--road) 0 3px,transparent 3px),linear-gradient(90deg,var(--road) 0 3px,transparent 3px);background-size:52px 52px;}
  .rd{position:absolute;background:var(--road-main);border-radius:3px;}
  .rd.h{height:16px;left:-6%;width:112%;}
  .rd.v{width:16px;top:-6%;height:112%;}
  .rd.diag{height:15px;width:70%;transform:rotate(26deg);transform-origin:left center;}
  .park{position:absolute;background:var(--park);border-radius:44% 56% 60% 40%/55% 45% 55% 45%;}
  .water{position:absolute;background:var(--water);border-radius:56% 44% 48% 52%/48% 56% 44% 52%;}
  .blockhi{position:absolute;background:var(--land);border-radius:3px;opacity:.7;}
  .routeline{position:absolute;inset:0;pointer-events:none;}
  .routeline path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.9;}
  .pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:3;filter:drop-shadow(0 4px 6px rgba(0,0,0,.28));}
  .pin .p{width:30px;height:30px;border-radius:50% 50% 50% 3px;transform:rotate(45deg);background:var(--pin);border:2px solid var(--pin-ring);display:grid;place-items:center;}
  .pin .p span{transform:rotate(-45deg);color:var(--pin-fg);font-weight:700;font-size:13px;}
  .pin.ghost .p{background:var(--pin-ghost);}
  .pin.ghost .p span{color:var(--card-sub);}

  .switcher{position:absolute;top:16px;left:16px;z-index:5;display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--card-solid) calc(var(--tw-list-opacity)*1%),transparent);color:var(--card-fg);border:1px solid var(--border);border-radius:var(--pill-radius);padding:9px 13px;box-shadow:var(--shadow);backdrop-filter:blur(calc(var(--tw-list-blur)*1px));font-weight:700;font-size:13px;cursor:pointer;}
  .switcher .ic{width:18px;height:18px;border-radius:5px;background:var(--accent);flex:0 0 auto;}
  .switcher .cr{color:var(--card-sub);font-size:11px;}

  .card{position:absolute;top:64px;right:16px;bottom:16px;width:286px;z-index:4;display:flex;flex-direction:column;background:color-mix(in srgb,var(--card-solid) calc(var(--tw-list-opacity)*1%),transparent);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(calc(var(--tw-list-blur)*1px));overflow:hidden;}
  .card .ch{padding:15px 16px 13px;border-bottom:1px solid var(--border);}
  .card .ch .t{font-weight:700;font-size:16px;color:var(--card-fg);letter-spacing:-.01em;}
  .card .ch .m{font-size:11.5px;color:var(--card-sub);margin-top:3px;}
  .rows{overflow:auto;flex:1;}
  .rows::-webkit-scrollbar{width:0;}
  .row{display:flex;gap:11px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s;}
  .row:hover{background:var(--row-hover);}
  .row .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-weight:700;font-size:12px;}
  .row .rt{flex:1;min-width:0;}
  .row .a1{font-size:13.5px;font-weight:600;color:var(--card-fg);}
  .row .a2{font-size:11.5px;color:var(--card-sub);margin-top:2px;}
  .row .dist{font-size:11px;color:var(--card-sub);font-family:'IBM Plex Mono',monospace;white-space:nowrap;padding-top:2px;}
  .card .cf{padding:11px 14px;border-top:1px solid var(--border);display:flex;gap:8px;}
  .btn{flex:1;font-weight:700;font-size:12.5px;border-radius:var(--btn-radius);padding:9px;border:1px solid var(--border);background:transparent;color:var(--card-fg);cursor:pointer;text-align:center;font-family:inherit;}
  .btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}

  .topbarm{position:absolute;top:0;left:0;right:0;z-index:5;padding:14px 14px 0;display:flex;gap:8px;align-items:stretch;}
  .switcher.full{position:static;flex:1;justify-content:center;}
  .themeicon{width:42px;height:42px;flex:0 0 auto;border-radius:12px;cursor:pointer;font-size:16px;display:grid;place-items:center;color:var(--card-fg);background:color-mix(in srgb,var(--card-solid) calc(var(--tw-list-opacity)*1%),transparent);border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(calc(var(--tw-list-blur)*1px));}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;height:250px;background:color-mix(in srgb,var(--card-solid) calc(var(--tw-list-opacity)*1%),transparent);border-top:1px solid var(--border);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.16);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(calc(var(--tw-list-blur)*1px));}
  .sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--card-sub);opacity:.45;margin:9px auto 4px;}
  .sheet .sh{padding:4px 16px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
  .sheet .sh .t{font-weight:700;font-size:15px;color:var(--card-fg);}
  .sheet .sh .m{font-size:11px;color:var(--card-sub);}

  .themesel{position:absolute;top:16px;right:16px;z-index:6;display:flex;gap:3px;padding:3px;background:color-mix(in srgb,var(--card-solid) calc(var(--tw-list-opacity)*1%),transparent);border:1px solid var(--border);border-radius:var(--pill-radius);box-shadow:var(--shadow);backdrop-filter:blur(calc(var(--tw-list-blur)*1px));}
  .themesel button{border:none;background:transparent;color:var(--card-sub);width:34px;height:28px;border-radius:calc(var(--pill-radius) - 3px);cursor:pointer;font-size:14px;display:grid;place-items:center;transition:background-color .2s,color .2s;font-family:inherit;}
  .themesel button:hover{color:var(--card-fg);}
  .themesel button.active{background:var(--accent);color:var(--accent-fg);}

  /* cross-fade */
  .app .map,.app .rd,.app .park,.app .water,.app .blockhi,.app .card,.app .sheet,.app .switcher,.app .themesel,.app .themeicon,.app .card .ch,.app .row,.app .btn{transition:background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease;}
  .app .routeline path,.app .pin .p{transition:stroke .4s ease,background-color .4s ease,border-color .4s ease;}

  /* ===== the two modes ===== */
  .app.dark{
    --font-head:'Space Grotesk',sans-serif;--font-body:'Space Grotesk',sans-serif;
    --land:#161c24;--land2:#11161d;--road:#1c232d;--road-main:#2b3541;--park:#16271e;--water:#122430;
    --card-solid:#161c24;--card-fg:#e9eef4;--card-sub:#8794a4;
    --border:rgba(255,255,255,.09);--border-soft:rgba(255,255,255,.05);--row-hover:rgba(94,234,212,.08);
    --accent:#5eead4;--accent-fg:#04120e;--accent-soft:rgba(94,234,212,.14);--accent-strong:#5eead4;
    --pin:#5eead4;--pin-fg:#04120e;--pin-ring:#0c1219;--pin-ghost:#2a333f;
    --shadow:0 12px 40px rgba(0,0,0,.55);--radius:14px;--pill-radius:11px;--btn-radius:9px;
  }
  .app.light{
    --font-head:'Space Grotesk',sans-serif;--font-body:'Space Grotesk',sans-serif;
    --land:#eef2f1;--land2:#e3e9e7;--road:#f4f8f6;--road-main:#ffffff;--park:#d3e6d6;--water:#c6dce2;
    --card-solid:#ffffff;--card-fg:#132320;--card-sub:#6d8079;
    --border:rgba(20,60,55,.12);--border-soft:rgba(20,60,55,.07);--row-hover:rgba(13,148,136,.08);
    --accent:#0d9488;--accent-fg:#ffffff;--accent-soft:rgba(13,148,136,.14);--accent-strong:#0b7267;
    --pin:#0d9488;--pin-fg:#ffffff;--pin-ring:#ffffff;--pin-ghost:#c9d6d2;
    --shadow:0 10px 30px rgba(15,60,55,.14);--radius:14px;--pill-radius:11px;--btn-radius:9px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>PinList — “Watch” design (developer reference)</h1>
    <p class="sub">Read-only list → map. Interactive day/night selector. Toggle either control; both screens sync.</p>
    <div class="layout">
      <div class="col-desk">
        <div class="cap">Desktop · floating card · selector top-right</div>
        <div class="win"><div class="winbar"><i></i><i></i><i></i><span class="u">pinlist.app/lists/watch</span></div>
          <div class="screen"><div class="app dark" data-app id="deskApp"></div></div>
        </div>
      </div>
      <div class="col-mob">
        <div class="cap">Mobile · bottom sheet · icon top-right</div>
        <div class="win"><div class="winbar"><i></i><i></i><i></i></div>
          <div class="screen mob"><div class="app dark" data-app id="mobApp"></div></div>
        </div>
      </div>
    </div>
  </div>

<script>
const PINS=[[22,70],[38,54],[55,62],[68,40],[82,50],[60,26]];
const STOPS=[["Kettle Creek Rd","North quarter"],["Highland Pass","Sector 2"],["Maple & 7th Ave","Midtown"],["Riverside Depot","Dock 4"],["Elmwood Ln","West block"],["Sunset Yard","Terminal"]];
const mapDecor=`
  <div class="grid"></div>
  <div class="park" style="width:180px;height:150px;top:-24px;left:12%;"></div>
  <div class="park" style="width:120px;height:100px;top:44%;left:2%;"></div>
  <div class="water" style="width:300px;height:180px;bottom:-46px;right:-40px;"></div>
  <div class="blockhi" style="width:120px;height:80px;top:20%;left:48%;"></div>
  <div class="blockhi" style="width:90px;height:110px;top:52%;left:60%;"></div>
  <div class="rd h" style="top:33%;"></div><div class="rd h" style="top:67%;"></div>
  <div class="rd v" style="left:43%;"></div><div class="rd v" style="left:74%;"></div>
  <div class="rd diag" style="top:8%;left:2%;"></div>`;
const pins=PINS.map((p,i)=>`<div class="pin" style="left:${p[0]}%;top:${p[1]}%;"><div class="p"><span>${i+1}</span></div></div>`).join("")
  +`<div class="pin ghost" style="left:30%;top:38%;"><div class="p"><span>·</span></div></div><div class="pin ghost" style="left:88%;top:30%;"><div class="p"><span>·</span></div></div>`;
const routeSvg=`<svg class="routeline" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M22,70 L38,54 L55,62 L68,40 L82,50 L60,26"/></svg>`;
const rows=n=>STOPS.slice(0,n).map((r,i)=>`<div class="row"><div class="n">${i+1}</div><div class="rt"><div class="a1">${r[0]}</div><div class="a2">${r[1]}</div></div><div class="dist">${(2.1+i*1.4).toFixed(1)} mi</div></div>`).join("");

document.getElementById('deskApp').innerHTML=`
  <div class="map">${mapDecor}</div>${routeSvg}${pins}
  <div class="switcher"><span class="ic"></span>Dispatch · Zone 4 <span class="cr">▾</span></div>
  <div class="themesel" data-sel><button data-mode="light" title="Day">☀</button><button data-mode="dark" class="active" title="Night">☾</button></div>
  <div class="card">
    <div class="ch"><div class="t">Dispatch · Zone 4</div><div class="m">6 active · 2 unassigned · live</div></div>
    <div class="rows">${rows(6)}</div>
    <div class="cf"><button class="btn pri">Open in Maps</button><button class="btn">Share</button></div>
  </div>`;
document.getElementById('mobApp').innerHTML=`
  <div class="map">${mapDecor}</div>${routeSvg}${pins}
  <div class="topbarm">
    <div class="switcher full"><span class="ic"></span>Dispatch · Zone 4 <span class="cr">▾</span></div>
    <button class="themeicon" data-modetoggle title="Day / night">☾</button>
  </div>
  <div class="sheet"><div class="grip"></div>
    <div class="sh"><div class="t">Dispatch · Zone 4</div><div class="m">6 stops · 11.4 mi</div></div>
    <div class="rows">${rows(4)}</div>
  </div>`;

let mode='dark';
const apps=[...document.querySelectorAll('[data-app]')];
function apply(m){
  mode=m;
  apps.forEach(a=>{a.classList.toggle('dark',m==='dark');a.classList.toggle('light',m==='light');});
  document.querySelectorAll('[data-sel] button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  const ic=document.querySelector('[data-modetoggle]');if(ic)ic.textContent=m==='dark'?'☾':'☀';
}
document.querySelectorAll('[data-sel] button').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.mode)));
document.querySelector('[data-modetoggle]').addEventListener('click',()=>apply(mode==='dark'?'light':'dark'));
</script>
</body>
</html>
